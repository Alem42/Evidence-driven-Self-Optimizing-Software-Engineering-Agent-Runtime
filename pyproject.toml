[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masa-runtime"
version = "0.1.0"
description = "Evidence-driven software engineering runtime: P0 foundation"
requires-python = ">=3.12,<3.15"
dependencies = []

# MCP 服务是可选依赖：核心保持零依赖；缺失时只有 MCP 入口报错。 The MCP server is optional: the core stays dependency-free.
[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
masa = "masa.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 角色定义（JSON + Markdown）不是 Python 文件，必须显式声明才会被打进包。
[tool.setuptools.package-data]
"masa.roles" = ["specs/*.json", "specs/*.md"]
