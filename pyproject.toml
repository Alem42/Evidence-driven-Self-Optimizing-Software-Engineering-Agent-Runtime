[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masa-runtime"
version = "0.1.0"
description = "Evidence-driven software engineering runtime: P0 foundation"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
masa = "masa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"masa.web" = ["static/*.html", "static/*.css", "static/*.js"]
