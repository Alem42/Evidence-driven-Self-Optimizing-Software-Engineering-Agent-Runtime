# 部署：docker compose up --build -d
#   默认 = 只读演示（MASA_DEMO=1）。要完整模式见 docs/guides/DEPLOY_DOCKER.md。
#   独立公网代理：加上 -f deploy/compose.proxy.yml；已有代理的服务器使用 deploy/compose.cloud.yml。
# Deploy: docker compose up --build -d. Default = read-only demo. An optional proxy is in deploy/compose.proxy.yml.
services:
  masa:
    build: .
    image: masa:latest
    restart: unless-stopped
    init: true
    environment:
      MASA_DEMO: "${MASA_DEMO:-1}"
      MASA_LOCAL_MODELS: "0"
      # 允许的 Host：本机端口 + 你的域名（如 demo.example.com）。防 DNS rebinding，所以不是随便什么 Host 都能访问。
      # Allowed Host headers: the published port plus your domain; defends against DNS rebinding, so not any Host works.
      MASA_ALLOWED_HOSTS: "${MASA_ALLOWED_HOSTS:-localhost:${MASA_PORT:-8765},127.0.0.1:${MASA_PORT:-8765},${MASA_DOMAIN:-}}"
      MASA_ORIGINS: "${MASA_ORIGINS:-http://localhost:${MASA_PORT:-8765},http://127.0.0.1:${MASA_PORT:-8765},https://${MASA_DOMAIN:-localhost}}"
    ports:
      - "${MASA_BIND_ADDRESS:-127.0.0.1}:${MASA_PORT:-8765}:8765"
    volumes:
      # 演示：把 scripts/ops/make_demo_state.py 生成的目录放到 ./demo-state（没有就用命名卷，空历史）。
      # Demo: put the directory made by scripts/ops/make_demo_state.py at ./demo-state (otherwise a named volume with empty history is used).
      - "${MASA_STATE:-masa-data}:/data"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:exec
      - /home/masa/.cache
    cap_drop:
      - ALL

volumes:
  masa-data:
